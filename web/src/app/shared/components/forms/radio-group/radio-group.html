<bq-field-label [text]="label()" [labelId]="inputId + '-label'" [required]="isRequired" />

<div
	class="bq-radio-group__options"
	role="radiogroup"
	[class]="'is-' + layout()"
	[attr.aria-labelledby]="inputId + '-label'"
	[attr.aria-required]="isRequired || null"
	[attr.aria-invalid]="isInvalid || null"
	[attr.aria-describedby]="describedBy ?? hintId">
	@for (option of options(); track option.id) {
		<label class="bq-radio" [class.is-selected]="option.id === selectedId" [class.is-disabled]="option.disabled">
			<input
				class="bq-radio__native"
				type="radio"
				[id]="optionId($index)"
				[name]="inputId"
				[value]="option.id"
				[checked]="option.id === selectedId"
				[disabled]="option.disabled || isDisabled"
				(change)="choose(option)" />

			<span class="bq-radio__dot" aria-hidden="true"></span>

			<span class="bq-radio__copy">
				<span class="bq-radio__label">{{ option.label | t }}</span>
				@if (option.description; as description) {
					<span class="bq-radio__description">{{ description | t }}</span>
				}
			</span>
		</label>
	}
</div>

@if (isInvalid) {
	<bq-inline-error [message]="control.errors | validationMessage" [errorId]="errorId" />
} @else if (hint()) {
	<p class="bq-radio-group__hint" [id]="hintId">{{ hint() }}</p>
}
