<div class="bq-calendar__head">
	<button
		class="bq-calendar__nav"
		type="button"
		[attr.aria-label]="'datepicker.previousMonth' | t"
		(click)="shiftMonth(-1)">
		<bq-icon name="chevron-left" [size]="18" />
	</button>
	<span class="bq-calendar__month" aria-live="polite">{{ monthLabel() }}</span>
	<button
		class="bq-calendar__nav"
		type="button"
		[attr.aria-label]="'datepicker.nextMonth' | t"
		(click)="shiftMonth(1)">
		<bq-icon name="chevron-right" [size]="18" />
	</button>
</div>

<table class="bq-calendar__grid" role="grid">
	<thead>
		<tr>
			@for (weekday of weekdays(); track $index) {
				<th class="bq-calendar__weekday" scope="col">{{ weekday }}</th>
			}
		</tr>
	</thead>
	<tbody>
		@for (week of weeks(); track $index) {
			<tr>
				@for (day of week; track day.date.getTime()) {
					<td class="bq-calendar__cell">
						<button
							class="bq-calendar__day"
							type="button"
							[class.is-outside]="!day.inMonth"
							[class.is-today]="day.isToday"
							[class.is-selected]="day.isSelected"
							[class.is-range-start]="day.isRangeStart"
							[class.is-range-end]="day.isRangeEnd"
							[class.is-in-range]="day.isInRange"
							[disabled]="day.disabled"
							[attr.aria-pressed]="day.isSelected || day.isInRange"
							(click)="pick(day)">
							{{ day.label }}
						</button>
					</td>
				}
			</tr>
		}
	</tbody>
</table>
