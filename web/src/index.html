<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Bareeq Al-Aeeq — Prestige Interior Atelier, Dubai</title>
		<base href="/" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta
			name="description"
			content="Bareeq Al-Aeeq is a prestige interior atelier in Dubai crafting residences that embody quiet luxury. Book a private consultation with our design studio." />
		<meta name="theme-color" content="#0B0A08" />
		<link rel="icon" type="image/svg+xml" href="brand/mark.svg" />

		<!-- Fonts and icons are served from this origin, so there is no third-party
		     connection to open before the first headline can paint. Only the Latin
		     faces are preloaded unconditionally — they carry every visitor's chrome
		     and numerals. The Arabic faces are preloaded from the script below
		     instead, because a static link here would fetch them for the English
		     majority that never renders an Arabic glyph. -->
		<link
			rel="preload"
			as="font"
			type="font/woff2"
			href="fonts/playfair-display-variable-latin.woff2"
			crossorigin />
		<link rel="preload" as="font" type="font/woff2" href="fonts/inter-variable-latin.woff2" crossorigin />
		<link rel="preload" as="image" type="image/svg+xml" href="icons/sprite.svg" />

		<!-- Applies the stored theme and language before first paint. Angular sets
		     the same attributes once it boots, but that is several hundred
		     milliseconds too late to avoid flashing the wrong palette.

		     This also decides whether the page animates at all. The scroll-reveal
		     styles hide their elements, so that rule has to be gated on a class
		     set before the first paint — otherwise content flashes in and then
		     hides itself. Gating it here also means a visitor who never runs this
		     script reads a static page rather than a blank one. -->
		<script>
			(function () {
				try {
					if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
						document.documentElement.classList.add("bq-motion");
					}
				} catch (error) {
					// No matchMedia: leave motion off and show everything.
				}

				try {
					var theme = localStorage.getItem("bq.theme");
					if (theme !== "dark" && theme !== "light") {
						theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
					}
					document.documentElement.dataset.theme = theme;

					var language = localStorage.getItem("bq.language");
					if (language !== "en" && language !== "ar") {
						language = navigator.language.indexOf("ar") === 0 ? "ar" : "en";
					}
					document.documentElement.lang = language;
					document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

					// The Arabic hero paints in Amiri 700 — the display stack falls
					// through to it per glyph, and 700 is the boldest cut Amiri has.
					// It is also the heaviest face in the build, and the stylesheet
					// would not ask for it until it had parsed. Requesting it here
					// costs the English majority nothing.
					if (language === "ar") {
						var preload = document.createElement("link");
						preload.rel = "preload";
						preload.as = "font";
						preload.type = "font/woff2";
						preload.href = "fonts/amiri-700-arabic.woff2";
						preload.crossOrigin = "anonymous";
						document.head.appendChild(preload);
					}
				} catch (error) {
					document.documentElement.dataset.theme = "dark";
				}
			})();
		</script>
	</head>
	<body>
		<bq-root></bq-root>
	</body>
</html>
